<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Katy Queens</title>
  <meta name="description" content="Daily Queens puzzle, streaks and leaderboard for Katy and Fay.">
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <!-- Lets Safari "Add to Home Screen" open it full screen like an app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Katy Queens">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Katy Queens</span>
    </div>
    <div class="streak-pill" id="streakPill" title="Katy's streak"></div>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-view="play" type="button">
      <span class="tab-icon" data-icon="crown"></span>Play
    </button>
    <button class="tab" data-view="leaderboard" type="button">
      <span class="tab-icon" data-icon="trophy"></span>Leaderboard
    </button>
  </nav>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
